services:

  minio:
    image: minio/minio
    ports:
    - 9000:9000
    - 9001:9001
    restart: always
    volumes:
    - storage:/data
    environment:
    - MINIO_ROOT_USER=admin
    - MINIO_ROOT_PASSWORD=jahodka123
    - TZ=Europe/Bratislava
    command: server /data --console-address ":9001"

volumes:
  storage:

