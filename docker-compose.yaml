services:
  minio:
    image: bitnami/minio:latest
    ports:
    - 9000:9000  # rest api
    - 9001:9001  # ui
    environment:
    - MINIO_ROOT_USER=admin
    - MINIO_ROOT_PASSWORD=jahodka123
    - MINIO_DEFAULT_BUCKETS=datasets,reports
    volumes:
    - storage:/bitnami/minio/data

volumes:
  storage:
  